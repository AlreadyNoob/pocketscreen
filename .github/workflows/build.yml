name: Build

# Builds the debug APK on every push and pull request, and publishes it as a GitHub release
# when the push is to main/master. The version (major.minor.patch) comes from the commit messages
# since the last release: see .github/scripts/version.sh.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is worked out from the tags and commits since the last release

      - name: Work out the version
        id: ver
        run: |
          set -euo pipefail
          .github/scripts/version.sh | tee version.out
          VERSION="$(grep '^VERSION=' version.out | cut -d= -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          APK="PocketScreen-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketscreen-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v${{ steps.apk.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.apk.outputs.version }} already exists, not creating it again."
            exit 0
          fi
          gh release create "v${{ steps.apk.outputs.version }}" "${{ steps.apk.outputs.file }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PocketScreen ${{ steps.apk.outputs.version }}" \
            --notes-file notes.md
