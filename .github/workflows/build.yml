name: Build

# Builds the debug APK on every push and pull request, and publishes it as a GitHub release
# when the push is to main/master.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="$(grep '^appVersion=' gradle.properties | cut -d= -f2).${{ github.run_number }}"
          APK="PocketScreen-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketscreen-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Release notes
        id: notes
        run: |
          set -euo pipefail
          BASE="$(grep '^appVersion=' gradle.properties | cut -d= -f2)"
          # The CHANGELOG.md section for this version becomes the release notes.
          awk -v v="$BASE" '/^## /{p=($2==v)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Debug APK. See the README for setup." > notes.md

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.apk.outputs.version }}" "${{ steps.apk.outputs.file }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PocketScreen ${{ steps.apk.outputs.version }}" \
            --notes-file notes.md
